services:
  postgres:
    image: postgres:16-alpine
    container_name: securewatch_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securewatch_db}
      POSTGRES_USER: ${POSTGRES_USER:-securewatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securewatch_user} -d ${POSTGRES_DB:-securewatch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: securewatch_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-securewatch_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-securewatch_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      ENVIRONMENT: production
      DEBUG: false
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_SIZE_BYTES: 52428800
      MODEL_PACKAGE_PATH: app/ml_models
    volumes:
      - securewatch_uploads:/data/uploads
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: securewatch_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  securewatch_uploads:
